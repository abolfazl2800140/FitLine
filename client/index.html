<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="Elite Fitness Hub - بزرگترین بازار مربیان فیتنس، شبکه اجتماعی ورزشی، برنامه‌های تمرینی و فروشگاه مکمل" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    
    <!-- Inter font for English/Numbers -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Vazirmatn - Better Persian font with all weights -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <title>Elite Fitness Hub | بزرگترین پلتفرم فیتنس ایران</title>
    
    <style>
      /* Vazirmatn as primary Persian font - more reliable than IranYekan CDN */
      :root {
        --font-persian: 'Vazirmatn', 'IranYekan', system-ui, sans-serif;
        --font-english: 'Inter', system-ui, sans-serif;
      }
      
      /* IranYekan as fallback */
      @font-face {
        font-family: 'IranYekan';
        src: url('https://cdn.jsdelivr.net/gh/AminMirzaei/IRANYekan-Fonts@main/woff2/IRANYekanWeb(FaNum).woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'IranYekan';
        src: url('https://cdn.jsdelivr.net/gh/AminMirzaei/IRANYekan-Fonts@main/woff2/IRANYekanWeb(FaNum)_Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'IranYekan';
        src: url('https://cdn.jsdelivr.net/gh/AminMirzaei/IRANYekan-Fonts@main/woff2/IRANYekanWeb(FaNum)_Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'IranYekan';
        src: url('https://cdn.jsdelivr.net/gh/AminMirzaei/IRANYekan-Fonts@main/woff2/IRANYekanWeb(FaNum)_ExtraBold.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }
      
      /* Loading screen */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(34, 197, 94, 0.2);
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loader"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Hide loading screen when app is ready -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loading-screen')?.classList.add('hidden');
        }, 300);
      });
    </script>
  </body>
</html>
